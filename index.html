<style>
:root{--bg:#F2EFE8;--card:#FBFAF6;--ink:#141414;--text:#3E3C38;--dim:#85817A;--line:rgba(20,20,20,.12);--blue:#2E3BFF;--blue2:#E3E6FF;--hot:#FF4A1C;--lime:#D7FF3A;
  --serif:"Fraunces",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
html[data-theme=dark]{--bg:#0F0F11;--card:#1A1A1E;--ink:#F2EFE8;--text:#C8C4BC;--dim:#8C8880;--line:rgba(242,239,232,.12);--blue:#4B57FF;--blue2:#23264d}
html[data-theme=dark] .btn{color:#0F0F11}html[data-theme=dark] .btn:hover{color:#fff}
html[data-theme=dark] .btn.out{color:var(--ink)}html[data-theme=dark] .btn.out:hover{color:#0F0F11}
html[data-theme=dark] .job::before{background:#24242A}
html[data-theme=dark] .chips span:hover{color:#0F0F11!important}
html[data-theme=dark] .chips span.k{color:var(--ink)}html[data-theme=dark] .chips span.k:nth-child(2){color:#0F0F11}
html[data-theme=dark] .num{box-shadow:6px 6px 0 #000}html[data-theme=dark] .cbox{box-shadow:10px 10px 0 #000}
html[data-theme=dark] .num:nth-child(2) b,html[data-theme=dark] .num:nth-child(2) p,html[data-theme=dark] .num:nth-child(2) sup{color:#0F0F11!important}
html[data-theme=dark] .jh .em{border-color:var(--ink)}

html[data-theme=dark] body::after{opacity:.05}
html.swapping *,html.swapping *::before,html.swapping *::after{transition:background-color .6s,color .6s,border-color .6s,box-shadow .6s!important}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--blue);color:#fff}

.page{display:grid;grid-template-columns:minmax(420px,46%) minmax(0,1fr);max-width:1500px;margin:0 auto}
.left{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:40px 56px 40px 48px;border-right:1px solid var(--line)}
.right{padding:40px 48px 0 64px;min-width:0}
body{overflow-x:clip}

.ltop{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.ltop .role{display:flex;gap:10px;align-items:center}
.ltop .role span{width:28px;height:1px;background:var(--ink)}
.rot{display:inline-block}
@keyframes bk{50%{opacity:0}}
.lng{position:relative;display:flex;align-items:center;height:38px;padding:3px;border-radius:12px;background:var(--card);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(3deg);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.lng:hover{transform:rotate(0) scale(1.06)}
.lng:active{box-shadow:1px 1px 0 var(--ink);translate:2px 2px}
.lng .o{position:relative;z-index:1;width:34px;text-align:center;font:800 12px var(--sans);letter-spacing:.04em;color:var(--dim);transition:color .3s}
.lng .kn{position:absolute;top:3px;left:3px;width:34px;height:28px;border-radius:8px;background:var(--blue);transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s}
.lng[data-l=en] .kn{transform:translateX(34px);background:var(--hot)}
.lng[data-l=es] .o[data-l=es],.lng[data-l=en] .o[data-l=en]{color:#fff}
.lng .bub{position:absolute;top:calc(100% + 10px);right:-6px;white-space:nowrap;font:700 13px var(--sans);background:var(--ink);color:var(--bg);padding:6px 11px;border-radius:10px;opacity:0;transform:translateY(-6px) scale(.8);pointer-events:none;transform-origin:top right}
.lng .bub::before{content:"";position:absolute;top:-5px;right:22px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
.lng .bub.on{animation:bub 1.8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes bub{0%{opacity:0;transform:translateY(-6px) scale(.8)}15%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,5.2vw,86px);line-height:.98;letter-spacing:-.035em;color:var(--ink);font-variation-settings:"opsz" 144}
h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
h1 .ln>span{display:inline-block;transform:translateY(110%);transition:transform 1.2s var(--ease)}
.go h1 .ln>span{transform:none}
h1 i{font-style:italic;color:var(--blue)}
h1 s{text-decoration:none;position:relative;color:var(--dim);font-size:.62em;vertical-align:.35em;margin-right:.08em}
h1 s::after{content:"";position:absolute;left:-6%;right:-6%;top:52%;height:.11em;background:var(--hot);transform:scaleX(0) rotate(-6deg);transform-origin:left;transition:transform .6s var(--ease) 1.4s;border-radius:4px}
.go h1 s::after{transform:scaleX(1) rotate(-6deg)}
h1 .sc{cursor:pointer;position:relative;display:inline-block;transition:transform .4s var(--ease)}
h1 .sc:hover{animation:wig .5s ease-in-out}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
h1 .sc svg{position:absolute;left:-12%;top:-14%;width:124%;height:136%;overflow:visible;pointer-events:none}
h1 .sc path{fill:none;stroke:var(--hot);stroke-width:3;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.3s var(--ease) 1.8s}
.go h1 .sc path{stroke-dashoffset:0}
h1 .ln{overflow:visible!important;padding-bottom:.12em}h1 .ln>span{opacity:0;transform:translateY(45%)!important;transition:transform 1.1s var(--ease),opacity .9s var(--ease)}.go h1 .ln>span{opacity:1;transform:none!important}
.lead{font-size:18px;max-width:440px;margin-top:26px}
.ctas{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.btn,.sticker{transition-property:background,color,transform,translate}
.btn{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 8px 0 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;transition:background .3s,color .3s}
.btn .c{width:36px;height:36px;border-radius:50%;background:var(--blue);display:grid;place-items:center;transition:transform .5s var(--ease),background .3s,color .3s}
.btn:hover{background:var(--blue)}.btn:hover .c{transform:rotate(-45deg);background:#fff;color:var(--blue)}
.btn.out{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:0 22px}
.btn.out:hover{background:var(--ink);color:#fff}
.fade{opacity:0;transform:translateY(14px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.go .fade{opacity:1;transform:none}
.go .d1{transition-delay:.55s}.go .d2{transition-delay:.7s}.go .d3{transition-delay:.85s}

.left{overflow:visible;z-index:3}
.sticker{position:absolute;right:-58px;top:34%;width:116px;height:116px;border-radius:50%;background:var(--hot);color:#fff;display:grid;place-items:center;z-index:5;transform:rotate(-12deg) scale(0);transition:transform .9s cubic-bezier(.34,1.56,.64,1) 1.2s,background .3s;box-shadow:0 12px 30px -10px rgba(255,74,28,.6)}
.go .sticker{transform:rotate(-12deg) scale(1)}
.sticker svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 12s linear infinite}
.sticker text{font:800 10.5px var(--sans);letter-spacing:.12em;fill:#fff}
.sticker .ic,.sticker .wv{grid-area:1/1;font-size:26px;transition:transform .5s var(--ease),opacity .3s}
.sticker .wv{opacity:0;transform:scale(.4)}
.sticker:hover{background:var(--ink)}.sticker:hover .ic{opacity:0;transform:scale(.4)}.sticker:hover .wv{opacity:1;transform:scale(1.3);animation:wave .8s ease-in-out infinite}
@keyframes wave{0%,100%{rotate:0deg}30%{rotate:18deg}60%{rotate:-10deg}}
.note{display:flex;align-items:flex-start;gap:6px;margin:10px 0 0 40px;font-family:"Caveat",cursive;font-size:26px;color:var(--hot);transform:rotate(-3deg)}
.note svg{width:70px;height:46px;flex:none;margin-top:-6px}
.note path{fill:none;stroke:var(--hot);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1.2s var(--ease) 2.2s}
.go .note path{stroke-dashoffset:0}
.hand{font-family:"Caveat",cursive;font-weight:700;color:var(--hot);font-size:24px;transform:rotate(-2deg);display:inline-block}
.lbot{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--line);stroke-width:2}
.ring .fg{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .2s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:400;color:var(--ink)}
.ring .orbit{position:absolute;inset:-6px;animation:spin 14s linear infinite}
.ring .orbit::before{content:"";position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}
.toc{list-style:none;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;color:var(--dim);transition:color .3s}
.toc a::before{content:"";width:0;height:1.5px;background:var(--blue);transition:width .4s var(--ease)}
.toc a.on{color:var(--ink)}.toc a.on::before{width:22px}
.toc a:hover{color:var(--ink)}

section{padding:56px 0;border-bottom:1px solid var(--line)}
section:first-child{padding-top:0}
.kick{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px}
.kick h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,2.8vw,42px);letter-spacing:-.03em;color:var(--ink);line-height:1.05}
.kick h2 em{display:inline-block;margin-left:12px;vertical-align:middle;font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#000;background:var(--lime);padding:6px 10px;border-radius:6px;transform:rotate(-4deg);font-style:normal}
.kick h2:hover em{animation:wig .5s ease-in-out}
.kick span{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--dim)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.num{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px}
.num.rv.in{transition:opacity .9s var(--ease),transform .5s var(--ease),box-shadow .5s}
.num:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(20,20,20,.3)}
.num b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(52px,4.6vw,72px);line-height:1;letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.num b sup{font-size:.42em;color:var(--blue);vertical-align:top;margin-left:2px}
.num p{font-size:14.5px;margin-top:10px;line-height:1.4}
.num.blue{background:var(--blue);border-color:var(--blue)}.num.blue b,.num.blue p,.num.blue b sup{color:#fff}

.jobs{border-top:1px solid var(--line)}
.job{border-bottom:1px solid var(--line);position:relative}
.job::before{content:"";position:absolute;inset:0 -18px;background:var(--ink);border-radius:16px;transform:scaleY(0);transform-origin:bottom;transition:transform .45s var(--ease);z-index:-1}
.job:hover::before{transform:scaleY(1)}
.job:hover .jh h3,.job:hover .jb li{color:#fff}.job:hover .jh small{color:var(--lime)}.job:hover .y{color:#aaa}.job:hover .pm{border-color:#555;color:#fff}.job:hover .jb li::before{background:var(--lime)}
.jobs{position:relative;z-index:0}.jb li,.jh h3,.jh small{transition:color .3s}
.jh{width:100%;display:grid;grid-template-columns:92px 1fr 44px;gap:16px;align-items:center;padding:22px 0;text-align:left}
.jh .y{font-size:14px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.jh h3{font-family:var(--serif);font-weight:400;font-size:clamp(22px,1.9vw,28px);letter-spacing:-.02em;color:var(--ink);line-height:1.15;transition:transform .5s var(--ease)}
.jh h3 small{display:block;margin-left:56px;font-family:var(--sans);font-size:14.5px;font-weight:700;color:var(--blue);letter-spacing:0;margin-top:3px}
.jh .em{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);margin-right:12px;vertical-align:-11px;transition:background .3s,color .3s,border-color .3s,transform .5s var(--ease)}
.jh .em svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.job.open .em{background:var(--blue);border-color:var(--blue);color:#fff}
.job:hover .em{background:var(--lime);border-color:var(--lime);color:var(--ink);transform:rotate(-8deg)}
.jh .now{display:inline-block;margin-left:8px;vertical-align:middle;font-family:var(--sans);font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--blue);padding:3px 8px;border-radius:999px}
.jh .pm{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--ink);transition:transform .5s var(--ease),background .3s,color .3s,border-color .3s}
.jh:hover h3{transform:translateX(6px)}
.jh:hover .pm{border-color:var(--ink)}
.job.open .pm{transform:rotate(135deg);background:var(--blue);color:#fff;border-color:var(--blue)}
.jb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.job.open .jb{grid-template-rows:1fr}
.jb>div{overflow:hidden}
.jb ul{list-style:none;padding:0 0 24px 108px}
.jb li{position:relative;padding-left:20px;margin-bottom:7px;font-size:16px}
.jb li::before{content:"";position:absolute;left:0;top:.75em;width:8px;height:1.5px;background:var(--blue)}
.also{margin-top:22px;font-size:15px;color:var(--dim)}
.also b{color:var(--ink);font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span:nth-child(3n){transform:rotate(-2deg)}.chips span:nth-child(4n+1){transform:rotate(1.5deg)}.chips span:nth-child(5n){transform:rotate(-1deg)}
.chips span.k:nth-child(2){background:var(--lime)}.chips span.k:nth-child(4){background:var(--hot);color:#fff}
.chips span{touch-action:none;user-select:none;cursor:grab;position:relative;font-size:15px;font-weight:700;color:var(--ink);padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);transition:background .3s,color .3s,transform .4s var(--ease)}
.chips span:hover{background:var(--ink)!important;color:#fff!important;transform:translateY(-4px) rotate(-4deg) scale(1.05)!important}
.chips span.k{background:var(--blue2);border-color:transparent}
.edu{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.edu div{padding:14px 0;border-top:1px solid var(--line)}
.edu b{display:block;font-weight:700;color:var(--ink);font-size:15.5px}
.edu small{font-size:14px;color:var(--dim)}

.bands{position:relative;height:190px;margin:30px -48px 0 -64px}
.bands .band{position:absolute;left:0;right:0;top:68px;margin:0!important;transform:rotate(-4deg)}
.bands .band.b2{transform:rotate(5deg);background:var(--hot);color:#fff;border-color:var(--ink);top:68px}
.band.b2 .bt b{color:var(--ink)}
.bt.rev{animation-direction:reverse}
.band{margin:46px -48px 0 -64px;background:var(--ink);color:var(--lime);transform:rotate(-2.5deg);padding:14px 0;overflow:hidden;white-space:nowrap;border-top:2px solid var(--lime);border-bottom:2px solid var(--lime)}
.bt{display:inline-flex;gap:28px;animation:mq 22s linear infinite;font:800 clamp(20px,2vw,28px) var(--sans);letter-spacing:-.01em;text-transform:uppercase}
.bt b{color:var(--hot)}
@keyframes mq{to{transform:translateX(-50%)}}
.contact{border-bottom:0;padding-bottom:0}
.cbox{position:relative;overflow:hidden;background:var(--blue);box-shadow:10px 10px 0 var(--ink);color:#fff;border-radius:30px;padding:46px 40px}
.cbox>*{position:relative}
.cbox h2{font-family:var(--serif);font-weight:400;font-size:clamp(36px,3.6vw,58px);line-height:1;letter-spacing:-.035em;max-width:560px}
.cbox h2 i{font-style:italic}
.cnote{position:absolute!important;right:44px;bottom:48px;color:var(--lime);transform:rotate(8deg);font-size:28px}
@media (max-width:1000px){.cnote{display:none!important}}
.chs{font-size:18px;opacity:.85;margin-top:14px}
.cbox .mail{display:inline-block;margin-top:26px;font-size:clamp(17px,1.6vw,23px);font-weight:700;border-bottom:1.5px solid rgba(255,255,255,.5);padding-bottom:4px}
.cbox .mail:hover{border-color:#fff}
.cbox .copy{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--blue);padding:6px 11px;border-radius:999px;margin-left:10px;vertical-align:middle}
.cbox .links{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.cbox .links a{font-size:14px;font-weight:700;padding:11px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.4);transition:background .3s,color .3s}
.cbox .links a:hover{background:#fff;color:var(--blue)}
.cbox .blob{transition:translate .6s var(--ease);position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,.25);animation:spin 30s linear infinite}
.cbox .blob::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;border-radius:50%;background:#fff}
.cbox .blob2{transition:translate .6s var(--ease);position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;border:1px dashed rgba(255,255,255,.3);animation:spin 18s linear infinite reverse}
.top{display:inline-block;font-weight:800;color:var(--ink);background:var(--lime);padding:3px 10px;border-radius:6px;transform:rotate(-3deg);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.top:hover{transform:rotate(3deg) translateY(-3px)}
footer{display:flex;justify-content:space-between;padding:22px 0 30px;font-size:13.5px;color:var(--dim)}

@media (max-width:1000px){
  .page{grid-template-columns:minmax(0,1fr)}
  .left{position:relative;height:auto;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:26px 22px 44px;gap:90px}
  .right{padding:0 22px}
  .lbot{display:block}.lbot .ring,.lbot .toc{display:none}
  section{padding:48px 0}section:first-child{padding-top:48px}
  .nums{grid-template-columns:1fr 1fr}.nums .num:last-child{grid-column:1/-1}
  .jh{grid-template-columns:1fr 40px}.jh .y{grid-column:1/-1;margin-bottom:-12px}
  .jb ul{padding-left:0}
  .edu{grid-template-columns:1fr}
  .cbox{padding:34px 26px}
}
